    <script>
    const TOGG_CITY_DISTANCES = {
        "İstanbul": { "Ankara": 450, "İzmir": 480, "Antalya": 700, "Bursa": 155, "Trabzon": 1060, "Adana": 935, "İstanbul": 0 },
        "Ankara": { "İstanbul": 450, "İzmir": 590, "Antalya": 485, "Bursa": 390, "Trabzon": 760, "Adana": 490, "Ankara": 0 },
        "İzmir": { "İstanbul": 480, "Ankara": 590, "Antalya": 460, "Bursa": 330, "Trabzon": 1350, "Adana": 900, "İzmir": 0 },
        "Bursa": { "İstanbul": 155, "Ankara": 390, "İzmir": 330, "Antalya": 550, "Trabzon": 1090, "Adana": 830, "Bursa": 0 },
        "Antalya": { "İstanbul": 700, "Ankara": 485, "İzmir": 460, "Bursa": 550, "Trabzon": 1250, "Adana": 570, "Antalya": 0 },
        "Trabzon": { "İstanbul": 1060, "Ankara": 760, "İzmir": 1350, "Bursa": 1090, "Antalya": 1250, "Adana": 920, "Trabzon": 0 },
        "Adana": { "İstanbul": 935, "Ankara": 490, "İzmir": 900, "Bursa": 830, "Antalya": 570, "Trabzon": 920, "Adana": 0 }
    };

    function calculateToggRoute() {
        const startEl = document.getElementById('routeStart');
        const destEl = document.getElementById('routeDest');
        if (!startEl || !destEl) return;

        const start = startEl.value;
        const dest = destEl.value;

        const distEl = document.getElementById('resDistance');
        const consEl = document.getElementById('resConsumption');
        const stopsEl = document.getElementById('resStops');
        const costEl = document.getElementById('resCost');
        const timeEl = document.getElementById('resTime');
        const titleEl = document.getElementById('resStopTitle');
        const subEl = document.getElementById('resStopSubtitle');
        const gmapsEl = document.getElementById('btnStartGmaps');

        if (start === dest) {
            if (distEl) distEl.innerText = "0 km";
            if (consEl) consEl.innerText = "0 kWh";
            if (stopsEl) stopsEl.innerText = "0 Durak";
            if (costEl) costEl.innerText = "₺0";
            if (timeEl) timeEl.innerText = "0s 0dk";
            if (titleEl) titleEl.innerText = "Aynı Şehir";
            if (subEl) subEl.innerText = "Başlangıç ve varış şehirleri aynı seçildi.";
            if (gmapsEl) gmapsEl.href = "#";
            return;
        }

        let distance = 400;
        if (TOGG_CITY_DISTANCES[start] && TOGG_CITY_DISTANCES[start][dest] !== undefined) {
            distance = TOGG_CITY_DISTANCES[start][dest];
        }

        const avgConsumptionPer100Km = 18.5;
        const totalEnergyKwh = (distance * avgConsumptionPer100Km) / 100;
        const usableBatteryKwh = 88.5;
        const realWorldRange = (usableBatteryKwh / avgConsumptionPer100Km) * 100;

        let chargingStops = 0;
        let chargedEnergyKwh = 0;

        if (distance > (realWorldRange * 0.85)) {
            const extraDist = distance - (realWorldRange * 0.85);
            chargingStops = Math.ceil(extraDist / (realWorldRange * 0.70));
            chargedEnergyKwh = (extraDist * avgConsumptionPer100Km) / 100;
        }

        const trugoPerKwh = 14.98;
        const totalCost = chargedEnergyKwh * trugoPerKwh;

        const drivingHours = distance / 105;
        const chargingMinutes = chargingStops * 28;
        const totalMinutes = Math.round(drivingHours * 60 + chargingMinutes);
        const hours = Math.floor(totalMinutes / 60);
        const mins = totalMinutes % 60;
        const timeStr = hours + "s " + mins + "dk";

        if (distEl) distEl.innerText = distance + " km";
        if (consEl) consEl.innerText = Math.round(totalEnergyKwh) + " kWh";
        if (stopsEl) stopsEl.innerText = chargingStops + " Durak";
        if (costEl) costEl.innerText = chargingStops === 0 ? "₺0" : ("₺" + Math.round(totalCost));
        if (timeEl) timeEl.innerText = timeStr;

        let stopText = "Trugo 300kW Ultra HPC İstasyonu";
        if ((start.includes('İstanbul') && dest.includes('Ankara')) || (start.includes('Ankara') && dest.includes('İstanbul'))) {
            stopText = "Önerilen Durak: Trugo Bolu Dağı Otoyol Dinlenme Tesisi (300kW HPC - 8 Soket)";
        } else if ((start.includes('İstanbul') && dest.includes('İzmir')) || (start.includes('İzmir') && dest.includes('İstanbul'))) {
            stopText = "Önerilen Durak: Trugo O-5 Otoyolu Balıkesir Batı Dinlenme Tesisi (300kW HPC)";
        } else if ((start.includes('Ankara') && dest.includes('Antalya')) || (start.includes('Antalya') && dest.includes('Ankara'))) {
            stopText = "Önerilen Durak: Trugo Afyonkarahisar Kolaylı Dinlenme Tesisi (300kW HPC)";
        } else if (dest.includes('Trabzon') || start.includes('Trabzon')) {
            stopText = "Önerilen Durak: Trugo Samsun Terme & Merzifon Otoyol Dinlenme İstasyonları (300kW HPC)";
        } else if (dest.includes('Adana') || start.includes('Adana')) {
            stopText = "Önerilen Durak: Trugo Aksaray Ağaçlı & Pozantı Dinlenme Tesisleri (300kW HPC)";
        }

        if (titleEl) titleEl.innerText = stopText;
        if (subEl) subEl.innerText = "Togg T10X 88.5 kWh batarya ile %20-%80 şarj Trugo 300kW istasyonunda ~28 dakikada tamamlanır.";
        if (gmapsEl) {
            gmapsEl.href = "https://www.google.com/maps/dir/" + encodeURIComponent(start) + "/" + encodeURIComponent(dest);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', calculateToggRoute);
    } else {
        calculateToggRoute();
    }
</script>
<!-- WAVE 2: Intersection Observer Fade-In Animations & Performance -->
<style>
html{scroll-behavior:smooth}
.fade-section{opacity:0;transform:translateY(30px);transition:opacity 0.8s ease,transform 0.8s ease}
.fade-section.visible{opacity:1;transform:translateY(0)}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
var sections=document.querySelectorAll('section');
sections.forEach(function(s){s.classList.add('fade-section')});
var observer=new IntersectionObserver(function(entries){
entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}})
},{threshold:0.1});
sections.forEach(function(s){observer.observe(s)});
});
</script>
    <!-- ChargeTogg Savings Calculator JS -->
    <script>
    let savingsState = {
        km: 1500,
        consumption: 7.5,
        petrolPrice: 44.26
    };

    function updateSavingsKm(val) {
        savingsState.km = parseInt(val, 10);
        const disp = document.getElementById('savingsKmDisplay');
        if (disp) disp.innerText = `${savingsState.km.toLocaleString('tr-TR')} km`;
        calculateSavings();
    }

    function calculateSavings() {
        const kmSlider = document.getElementById('savingsKmSlider');
        const consInput = document.getElementById('petrolConsumptionInput');
        const priceInput = document.getElementById('petrolPriceInput');

        if (kmSlider) savingsState.km = parseFloat(kmSlider.value) || 1500;
        if (consInput) savingsState.consumption = parseFloat(consInput.value) || 7.5;
        if (priceInput) savingsState.petrolPrice = parseFloat(priceInput.value) || 44.26;

        const monthlyPetrol = (savingsState.km / 100) * savingsState.consumption * savingsState.petrolPrice;
        const toggKwhPer100Km = 18.5;
        const trugoDcRate = 14.98;
        const monthlyEv = (savingsState.km / 100) * toggKwhPer100Km * trugoDcRate;

        const monthlySavings = Math.max(0, monthlyPetrol - monthlyEv);
        const annualSavings = monthlySavings * 12;
        const savingsPercent = monthlyPetrol > 0 ? Math.min(100, Math.max(0, (monthlySavings / monthlyPetrol) * 100)) : 0;

        const petrolEl = document.getElementById('monthlyPetrolCost');
        const evEl = document.getElementById('monthlyEvCost');
        const savingsEl = document.getElementById('monthlySavingsOutput');
        const annualEl = document.getElementById('annualSavingsOutput');
        const pctDisp = document.getElementById('savingsPercentDisplay');
        const pBar = document.getElementById('savingsProgressBar');

        if (petrolEl) petrolEl.innerText = `₺${Math.round(monthlyPetrol).toLocaleString('tr-TR')}`;
        if (evEl) evEl.innerText = `₺${Math.round(monthlyEv).toLocaleString('tr-TR')}`;
        if (savingsEl) savingsEl.innerText = `₺${Math.round(monthlySavings).toLocaleString('tr-TR')}`;
        if (annualEl) annualEl.innerText = `₺${Math.round(annualSavings).toLocaleString('tr-TR')} / yıl`;
        if (pctDisp) pctDisp.innerText = `%${savingsPercent.toFixed(1)} Daha Ekonomik`;
        if (pBar) pBar.style.width = `${Math.max(5, savingsPercent)}%`;
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', calculateSavings);
    } else {
        calculateSavings();
    }
    </script>

<script>
window.addEventListener('scroll', function() {
    var btn = document.getElementById('backToTopBtn');
    if (btn) {
        if (window.scrollY > 300) {
            btn.classList.remove('opacity-0', 'pointer-events-none');
            btn.classList.add('opacity-100');
        } else {
            btn.classList.add('opacity-0', 'pointer-events-none');
            btn.classList.remove('opacity-100');
        }
    }
});

function initCookieConsent() {
    if (!localStorage.getItem('cookie_consent_accepted')) {
        setTimeout(function() {
            var banner = document.getElementById('cookieConsentBanner');
            if (banner) {
                banner.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
                banner.classList.add('translate-y-0', 'opacity-100');
            }
        }, 800);
    }
}
function acceptCookieConsent() {
    localStorage.setItem('cookie_consent_accepted', 'true');
    var banner = document.getElementById('cookieConsentBanner');
    if (banner) {
        banner.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
        banner.classList.remove('translate-y-0', 'opacity-100');
    }
}
document.addEventListener('DOMContentLoaded', initCookieConsent);
</script>
