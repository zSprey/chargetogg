<!DOCTYPE html>
<html lang="tr" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChargeTogg | Harita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: '#10b981', bgdark: '#0f172a', card: '#1e293b' } } } }</script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"/>
    <style>
        html.dark .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        html:not(.dark) .leaflet-tile-pane { filter: none; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-bgdark text-gray-800 dark:text-gray-200 font-sans h-full flex flex-col overflow-hidden transition-colors">
    <nav class="bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-slate-800 h-16 flex-shrink-0 z-50 relative shadow-sm">
        <div class="max-w-full mx-auto px-4 flex justify-between h-full items-center">
            <span class="text-black dark:text-white text-2xl font-black"><i class="fa-solid fa-bolt text-brand mr-2"></i>Charge<span class="text-brand">Togg</span></span>
            <div class="flex gap-4 items-center">
                <button onclick="toggleTheme()" class="text-gray-500 dark:text-gray-400 hover:text-brand"><i id="themeIcon" class="fa-solid fa-sun text-xl"></i></button>
            </div>
        </div>
    </nav>
    <div class="flex flex-1 relative">
        <aside class="w-[300px] bg-white dark:bg-card border-r border-gray-200 dark:border-slate-800 p-4 overflow-y-auto hidden md:flex flex-col z-40 transition-colors">
            <h2 class="text-lg font-black dark:text-white mb-4">Rota Ciz</h2>
            <form onsubmit="event.preventDefault(); calcRoute();" class="space-y-2 mb-4">
                <input type="text" id="startCity" placeholder="Kalkis" class="w-full bg-gray-100 dark:bg-slate-900 dark:text-white rounded p-2 text-sm outline-none" required>
                <input type="text" id="endCity" placeholder="Varis" class="w-full bg-gray-100 dark:bg-slate-900 dark:text-white rounded p-2 text-sm outline-none" required>
                <button type="submit" class="w-full bg-brand text-white font-bold py-2 rounded text-sm">Hesapla</button>
            </form>
            <div id="stationList" class="space-y-2"></div>
        </aside>
        <main class="flex-1 relative z-10 bg-gray-200 dark:bg-slate-800 transition-colors" id="map"></main>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            document.getElementById('themeIcon').className = document.documentElement.classList.contains('dark') ? 'fa-solid fa-sun text-xl' : 'fa-solid fa-moon text-xl';
        }
        const stations = [
            { name: "Trugo Bolu", coords: [40.732, 31.579], op: "Trugo", hex: "#3b82f6" },
            { name: "ZES Istanbul", coords: [41.062, 28.807], op: "ZES", hex: "#f97316" },
            { name: "Esarj Akasya", coords: [40.999, 29.052], op: "Esarj", hex: "#ef4444" },
            { name: "Trugo Ankara", coords: [39.911, 32.812], op: "Trugo", hex: "#3b82f6" },
            { name: "ZES Izmir", coords: [38.411, 27.062], op: "ZES", hex: "#f97316" }
        ];
        let map, markersCluster;
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([39.0, 35.0], 6);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            markersCluster = L.markerClusterGroup();
            map.addLayer(markersCluster);
            stations.forEach(st => {
                let m = L.circleMarker(st.coords, {radius:8, fillColor:st.hex, color:'#fff', weight:2, fillOpacity:1}).bindPopup(`<b>${st.name}</b>`);
                markersCluster.addLayer(m);
                document.getElementById('stationList').innerHTML += `<div class="bg-gray-100 dark:bg-slate-900 p-2 rounded text-sm dark:text-white cursor-pointer" onclick="map.flyTo([${st.coords}],14)">${st.name} - ${st.op}</div>`;
            });
        }
        async function getCoords(city) {
            try { const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${city},Turkey`); const d = await res.json(); return d.length ? L.latLng(d[0].lat, d[0].lon) : null; } catch(e){} return null;
        }
        async function calcRoute() {
            let s = await getCoords(document.getElementById('startCity').value);
            let e = await getCoords(document.getElementById('endCity').value);
            if(s && e) L.Routing.control({waypoints:[s,e], lineOptions:{styles:[{color:'#10b981', weight:4}]}, show:false, createMarker:()=>null}).addTo(map);
        }
        window.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
