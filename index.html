        let map, markersCluster, routingControl = null;
        let activeOp = 'all', activePwr = 'all';

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([39.0, 35.0], 6);
            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap &copy; ChargeTogg'
            }).addTo(map);

            markersCluster = L.markerClusterGroup({
                maxClusterRadius: 45,
                iconCreateFunction: function(cluster) {
                    const count = cluster.getChildCount();
                    let color = 'bg-brand';
                    if (count > 10) color = 'bg-blue-500';
                    if (count > 25) color = 'bg-purple-500';
                    return L.divIcon({
                        html: `<div class="${color} text-slate-950 font-black w-8 h-8 flex items-center justify-center rounded-full border-2 border-slate-950 shadow-xl text-xs">${count}</div>`,
                        className: ''
                    });
                }
            });
            map.addLayer(markersCluster);
            renderStations(stations);
        }

        function renderStations(list) {
            document.getElementById('stationCount').innerText = `${list.length} İstasyon`;
            const container = document.getElementById('stationList');
            container.innerHTML = '';
            markersCluster.clearLayers();

            list.forEach(st => {
                const marker = L.circleMarker(st.coords, {
                    radius: 8,
                    fillColor: st.hex,
                    color: '#ffffff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.95
                }).bindPopup(`
                    <div style="color:#0f172a; font-family:sans-serif; min-width:190px; padding:2px;">
                        <span style="background:${st.hex}; color:#fff; font-size:9px; font-weight:900; padding:2px 6px; border-radius:4px; text-transform:uppercase;">${st.op}</span>
                        <h4 style="margin:6px 0 2px 0; font-weight:800; font-size:13px; color:#0f172a;">${st.name}</h4>
                        <p style="margin:0 0 4px 0; font-size:11px; color:#64748b;">${st.city}, Türkiye</p>
                        <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #e2e8f0; padding-top:4px; margin-top:4px;">
                            <span style="color:#10b981; font-weight:bold; font-size:11px;">⚡ ${st.power}</span>
                            <span style="color:#0f172a; font-weight:900; font-size:11px;">${st.price}</span>
                        </div>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${st.coords[0]},${st.coords[1]}" target="_blank" style="display:block; text-align:center; background:#3b82f6; color:#fff; font-size:11px; font-weight:bold; padding:4px 8px; border-radius:6px; margin-top:6px; text-decoration:none;">
                            <i class="fa-solid fa-location-arrow"></i> Google Haritalar'da Git
                        </a>
                    </div>
                `);
                markersCluster.addLayer(marker);

                container.innerHTML += `
                    <div onclick="flyToStation(${st.coords[0]}, ${st.coords[1]})" class="station-card p-3 rounded-xl bg-slate-900 border border-slate-800 hover:border-brand cursor-pointer transition shadow-sm">
                        <div class="flex justify-between items-start mb-1">
                            <h5 class="text-xs font-bold text-white truncate pr-2">${st.name}</h5>
                            <span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">${st.op}</span>
                        </div>
                        <div class="flex justify-between items-center text-[10px] text-slate-400 mt-1.5">
                            <span class="text-emerald-400 font-semibold flex items-center gap-1"><i class="fa-solid fa-bolt"></i>${st.power}</span>
                            <span class="font-bold text-slate-300">${st.price}</span>
                        </div>
                    </div>
                `;
            });
        }

        function flyToStation(lat, lng) {
            map.flyTo([lat, lng], 14, { duration: 1.5 });
            if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('-translate-x-full');
        }

        function applyCombinedFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let result = stations;

            if (query) {
                result = result.filter(s => 
                    s.name.toLowerCase().includes(query) || 
                    s.city.toLowerCase().includes(query) || 
                    s.op.toLowerCase().includes(query)
                );
            }
            if (activeOp !== 'all') result = result.filter(s => s.op.toLowerCase() === activeOp.toLowerCase());
            if (activePwr === 'hpc') result = result.filter(s => s.kw >= 300);
            else if (activePwr === 'dc') result = result.filter(s => s.kw >= 120 && s.kw < 300);

            renderStations(result);
        }

        function filterStations() { applyCombinedFilters(); }
        function filterOp(op) {
            activeOp = op;
            document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('bg-brand', 'text-slate-950', 'font-black'));
            event.target.classList.add('bg-brand', 'text-slate-950', 'font-black');
            applyCombinedFilters();
        }

        function filterPower(pwr) {
            activePwr = pwr;
            document.querySelectorAll('.pwr-btn').forEach(b => b.classList.remove('bg-slate-800', 'text-white'));
            event.target.classList.add('bg-slate-800', 'text-white');
            applyCombinedFilters();
        }

        async function getCoordinates(query) {
            const clean = query.trim().toLowerCase();
            if (cityCoordinatesFallback[clean]) {
                const fb = cityCoordinatesFallback[clean];
                return L.latLng(fb[0], fb[1]);
            }
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}, Turkey`);
                const data = await res.json();
                if (data && data.length > 0) return L.latLng(data[0].lat, data[0].lon);
            } catch(e) {}
            return null;
        }

        async function calcRoute() {
            const startStr = document.getElementById('startCity').value.trim();
            const endStr = document.getElementById('endCity').value.trim();
            const btn = document.getElementById('routeBtn');
            btn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> Hesaplanıyor...`;

            const startCoords = await getCoordinates(startStr);
            const endCoords = await getCoordinates(endStr);

            if (!startCoords || !endCoords) {
                alert("Şehir konumu bulunamadı. Lütfen geçerli bir il adı giriniz (Örn: İstanbul, Ankara, İzmir, Antalya).");
                btn.innerHTML = `<i class="fa-solid fa-bolt"></i> Haritada Rota Çiz`;
                return;
            }

            // Google Maps Direct Navigation Link Setup
            const gmapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(startStr + ', Türkiye')}&destination=${encodeURIComponent(endStr + ', Türkiye')}&travelmode=driving`;
            document.getElementById('googleMapsBtn').href = gmapsUrl;
            document.getElementById('googleMapsActionArea').classList.remove('hidden');

            if (routingControl) map.removeControl(routingControl);

            routingControl = L.Routing.control({
                waypoints: [startCoords, endCoords],
                lineOptions: { styles: [{ color: '#10b981', weight: 5, opacity: 0.95 }] },
                createMarker: () => null,
                show: false
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                const distanceKm = Math.round(e.routes[0].summary.totalDistance / 1000);
                const chargeStops = Math.max(1, Math.ceil(distanceKm / 320));
                document.getElementById('routeDistance').innerText = `~${distanceKm} km (${chargeStops} Şarj Molası)`;
                btn.innerHTML = `<i class="fa-solid fa-check"></i> Rota Hazır`;
                setTimeout(() => { btn.innerHTML = `<i class="fa-solid fa-bolt"></i> Haritada Rota Çiz`; }, 3000);
                if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('-translate-x-full');
            });

            routingControl.on('routingerror', function() {
                btn.innerHTML = `<i class="fa-solid fa-bolt"></i> Haritada Rota Çiz`;
                map.fitBounds([startCoords, endCoords], { padding: [50, 50] });
            });
        }

        function locateUser() {
            if (!navigator.geolocation) return alert('Tarayıcınız konum servisini desteklemiyor.');
            navigator.geolocation.getCurrentPosition(pos => {
                map.flyTo([pos.coords.latitude, pos.coords.longitude], 13);
            }, () => alert('Konum izni alınamadı.'));
        }

        window.onload = initMap;
    </script>
</body>
</html>
